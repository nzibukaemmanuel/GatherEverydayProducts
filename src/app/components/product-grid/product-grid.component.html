<section class="products wrap" id="featured">
  <div class="section-head">
    <div>
      <span class="eyebrow">This week</span>
      <h2>New arrivals</h2>
    </div>
    <a routerLink="/products">View all →</a>
  </div>

  <div class="grid">
    @for (p of products; track p.sku) {
      <app-product-card [product]="p"></app-product-card>
    }
  </div>
</section>
