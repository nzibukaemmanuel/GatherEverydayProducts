<header>
  <div class="wrap nav-row">
    <button class="icon-btn sidebar-toggle" aria-label="Browse menu" (click)="toggleSidebar()">
      <app-icon name="menu" [size]="20"></app-icon>
    </button>

    <a class="logo" href="#">Gather<span>.</span></a>

    <nav class="primary-nav">
      @for (link of navLinks; track link) {
        <a href="#">{{ link }}</a>
      }
    </nav>

    <div class="search-box">
      <app-icon name="search" [size]="16"></app-icon>
      <input placeholder="Search products" />
    </div>

    <div class="header-actions">
      <button
        class="icon-btn"
        [attr.aria-label]="(themeService.theme$ | async) === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="themeService.toggle()"
      >
        <app-icon [name]="(themeService.theme$ | async) === 'dark' ? 'sun' : 'moon'" [size]="19"></app-icon>
      </button>
      <button class="icon-btn" aria-label="Account" (click)="openLogin()">
        <app-icon name="user" [size]="20"></app-icon>
      </button>
      <button class="icon-btn" aria-label="Cart">
        <app-icon name="cart" [size]="20"></app-icon>
        <span class="cart-badge">{{ cartCount }}</span>
      </button>
      <button class="btn btn-primary" (click)="openSignup()">Sign up</button>
      <button class="hamburger icon-btn" aria-label="Menu" (click)="toggleMobileNav()">
        <app-icon name="menu" [size]="20"></app-icon>
      </button>
    </div>
  </div>

  @if (mobileNavOpen) {
    <nav class="mobile-nav">
      @for (link of navLinks; track link) {
        <a href="#">{{ link }}</a>
      }
    </nav>
  }
</header>

<app-sidebar-menu [open]="sidebarOpen" (closed)="closeSidebar()"></app-sidebar-menu>
